"""
Binary (2-outcome) condition registered on the CTF. Splits/merges/redemptions
for conditions not registered here are ignored (same rule as Polymarket's
official oi-subgraph).
"""
type Condition @entity(immutable: true) {
  id: ID!                                    # conditionId
  oracle: Bytes!
  questionId: Bytes!
  createdAtBlock: BigInt!
}

"Neg-risk market (NegRiskAdapter marketId)"
type NegRiskEvent @entity(immutable: false) {
  id: ID!                                    # marketId
  feeBps: BigInt!
  questionCount: Int!
}

"""
Per-question conversion bookkeeping for a neg-risk question (id = conditionId).
convertPositions burns the caller's NO on the converted questions and mints YES on
the others. mintedRaw / burnedRaw are what those conversions added to / took from
this question's OI and are settled when the adapter reports the outcome:
reported NO -> the minted YES is worthless and is removed; reported YES -> the
burned NO was worthless, so the debit is given back.
"""
type NegRiskQuestion @entity(immutable: false) {
  id: ID!                                    # conditionId
  marketId: Bytes!
  questionId: Bytes!
  "0 = unresolved, 1 = reported YES, 2 = reported NO"
  outcome: Int!
  mintedRaw: BigInt!
  burnedRaw: BigInt!
  reportedAtBlock: BigInt
}

"""
Per-market open interest.

`amount` is unpriced collateral attribution (splits - merges - redemptions, plus
neg-risk conversion bookkeeping from PositionsConverted / OutcomeReported). It
matches Polymarket's data-api on regular binary markets, where yesSupply ==
noSupply == amount, because priced gross OI = yes*p + no*(1-p) collapses to
amount when p+(1-p)=1 and supplies are balanced.

On open neg-risk markets the data-api reports priced gross OI:
  yesSupply * yesPrice + noSupply * (1 - yesPrice)
That cannot be produced on-chain (no CLOB prices). Use yesSupply and noSupply
and apply a price off-chain. `amount` remains the collateral figure; after the
event is fully reported and winning tokens are redeemed, it settles back in
line with global OI.
"""
type MarketOpenInterest @entity(immutable: false) {
  id: ID!                                    # conditionId
  conditionId: Bytes!
  "USDC.e for both standard and neg-risk markets (neg-risk OI is tracked in USDC terms via the NegRiskAdapter)"
  collateralToken: Bytes!
  negRisk: Boolean!
  amount: BigDecimal!                        # unpriced collateral attribution, 6 decimals
  amountRaw: BigInt!
  "Circulating YES outcome-token supply (6 decimals). Includes YES minted by convertPositions. Tokens at the NO burn address are excluded."
  yesSupply: BigDecimal!
  yesSupplyRaw: BigInt!
  "Circulating NO outcome-token supply (6 decimals). NO sent to the adapter burn address is excluded."
  noSupply: BigDecimal!
  noSupplyRaw: BigInt!
  splitCount: BigInt!
  mergeCount: BigInt!
  redemptionCount: BigInt!
  "Incremented on every PositionsConverted in this question's event (both mint and burn sides), so it is identical across questions of the same event."
  conversionCount: BigInt!
  "Conversions that minted YES on this question (it was outside the indexSet)."
  convertMintCount: BigInt!
  "Conversions that burned this question's NO (it was in the indexSet)."
  convertBurnCount: BigInt!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
  snapshots: [OISnapshot!]! @derivedFrom(field: "market")
}

type OISnapshot @entity(immutable: false) {
  id: ID!                                    # conditionId-hourId
  market: MarketOpenInterest!
  amount: BigDecimal!
  amountRaw: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type GlobalOpenInterest @entity(immutable: false) {
  id: ID!                                    # singleton "global"
  amount: BigDecimal!
  amountRaw: BigInt!
  marketCount: Int!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}
