"""
Binary (2-outcome) condition registered on the CTF. Splits/merges/redemptions
for conditions not registered here are ignored (same rule as Polymarket's
official oi-subgraph).
"""
type Condition @entity(immutable: true) {
  id: ID!                                    # conditionId
  oracle: Bytes!
  questionId: Bytes!
  createdAtBlock: BigInt!
}

"""
CTF ConditionResolution for a registered binary condition (written once). Lets a
market created after resolution start out resolved.
"""
type ConditionPayout @entity(immutable: true) {
  id: ID!                                    # conditionId
  "[yes, no] payout numerators; denominator = yes + no"
  payoutNumerators: [BigInt!]!
  blockNumber: BigInt!
}

"""
Polymarket V2 migration link (BinaryModule / NegRiskModule MigrationConditionRegistered).
Two rows per registration: id = V2 condition id -> counterpart = legacy CTF condition id,
and id = legacy CTF condition id -> counterpart = V2 condition id. V2 condition ids are the
32-byte form Gamma uses (bytes31 ConditionId + zero outcome byte).
"""
type MigrationLink @entity(immutable: true) {
  id: ID!
  counterpart: Bytes!
}

"Neg-risk market (NegRiskAdapter marketId)"
type NegRiskEvent @entity(immutable: false) {
  id: ID!                                    # marketId
  feeBps: BigInt!
  questionCount: Int!
}

"""
Per-question conversion bookkeeping for a neg-risk question (id = conditionId).
convertPositions burns the caller's NO on the converted questions and mints YES on
the others. mintedRaw / burnedRaw are what those conversions added to / took from
this question's OI and are settled when the adapter reports the outcome:
reported NO -> the minted YES is worthless and is removed; reported YES -> the
burned NO was worthless, so the debit is given back.
"""
type NegRiskQuestion @entity(immutable: false) {
  id: ID!                                    # conditionId
  marketId: Bytes!
  questionId: Bytes!
  "0 = unresolved, 1 = reported YES, 2 = reported NO"
  outcome: Int!
  mintedRaw: BigInt!
  burnedRaw: BigInt!
  reportedAtBlock: BigInt
}

"""
Per-market open interest.

`amount` is unpriced collateral attribution (splits - merges - redemptions, plus
neg-risk conversion bookkeeping from PositionsConverted / OutcomeReported). It
matches Polymarket's data-api on regular binary markets, where yesSupply ==
noSupply == amount, because priced gross OI = yes*p + no*(1-p) collapses to
amount when p+(1-p)=1 and supplies are balanced.

On open neg-risk markets the data-api reports priced gross OI:
  yesSupply * yesPrice + noSupply * (1 - yesPrice)
That cannot be produced on-chain (no CLOB prices). Use yesSupply and noSupply
and apply a price off-chain. `amount` remains the collateral figure; after the
event is fully reported and winning tokens are redeemed, it settles back in
line with global OI.
"""
type MarketOpenInterest @entity(immutable: false) {
  id: ID!                                    # conditionId (V2: 32-byte Gamma conditionId, top byte = module id)
  conditionId: Bytes!
  "USDC.e for legacy standard and neg-risk markets (neg-risk OI is tracked in USDC terms via the NegRiskAdapter); pUSD for Polymarket V2 PositionManager markets."
  collateralToken: Bytes!
  "True when the condition's oracle is the NegRiskAdapter (set at creation), regardless of which contract touched it first."
  negRisk: Boolean!
  amount: BigDecimal!                        # unpriced collateral attribution, 6 decimals
  amountRaw: BigInt!
  """
  Circulating YES outcome-token supply (6 decimals). Includes YES minted by
  convertPositions; NO at the adapter burn address is excluded. Once the market is
  resolved a side with payout numerator 0 is worthless and is pinned to 0 (it is
  set to 0 at resolution and later mints/burns on it are ignored); a paying side
  is the outstanding unredeemed supply. Neg-risk redemptions give exact token
  amounts. CTF redemptions only give the payout, so burns are derived from it:
  for [1,0] / [0,1] the winning tokens burned == payout exactly; for split payouts
  (e.g. [1,1]) the burned tokens (payout * den / weighted) are allocated across the
  redeemed sides in proportion to their supplies (approximation). On neg-risk
  questions only adapter (WrappedCollateral) activity moves supplies; direct CTF
  activity with USDC.e on a neg-risk condition uses different position ids and is
  ignored for supplies (it still counts in `amount`).
  Priced OI = yesSupply * p + noSupply * (1 - p); after resolution this equals
  the outstanding payout value with p = yes numerator / denominator.
  """
  yesSupply: BigDecimal!
  yesSupplyRaw: BigInt!
  "Circulating NO outcome-token supply (6 decimals). Same rules as yesSupply."
  noSupply: BigDecimal!
  noSupplyRaw: BigInt!
  "True once the CTF reported payouts for this condition (ConditionResolution)."
  resolved: Boolean!
  "[yes, no] payout numerators from ConditionResolution; null while unresolved."
  payoutNumerators: [BigInt!]
  resolvedAtBlock: BigInt
  splitCount: BigInt!
  mergeCount: BigInt!
  "Redemptions that touched this market. Zero-payout USDC.e CTF redemptions on neg-risk conditions (no-op calls on positions that do not exist) are not counted."
  redemptionCount: BigInt!
  "Incremented on every PositionsConverted in this question's event (both mint and burn sides), so it is identical across questions of the same event."
  conversionCount: BigInt!
  "Conversions that minted YES on this question (it was outside the indexSet)."
  convertMintCount: BigInt!
  "Conversions that burned this question's NO (it was in the indexSet)."
  convertBurnCount: BigInt!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
  snapshots: [OISnapshot!]! @derivedFrom(field: "market")
}

type OISnapshot @entity(immutable: false) {
  id: ID!                                    # conditionId-hourId
  market: MarketOpenInterest!
  amount: BigDecimal!
  amountRaw: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type GlobalOpenInterest @entity(immutable: false) {
  id: ID!                                    # singleton "global"
  amount: BigDecimal!
  amountRaw: BigInt!
  marketCount: Int!
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}
