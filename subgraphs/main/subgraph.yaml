specVersion: 1.0.0
description: >-
  Polymarket CLOB V2 main — trades, markets, positions, accounts and orderbook
  aggregates for the V2 exchanges (CTF Exchange 0xE111…996B and Neg Risk 0xe222…0F59;
  collateral pUSD, 6-decimals). V2-only: the shared Conditional Tokens contract is indexed
  from the V2 era, not genesis. Pre-V2 conditions that keep trading on V2 are captured via
  on-the-fly stub Conditions when their pUSD positions are split, so every V2-traded market
  maps to its condition without indexing V1 history (stubs carry a null oracle/questionId —
  recover from the conditionId via Polymarket's Gamma API). positionId→condition derivation
  is gated to once per (condition, collateral) for indexing speed.
repository: https://github.com/PaulieB14/polymarket-v2-subgraphs
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ConditionalTokens
    network: matic
    source:
      address: "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
      abi: ConditionalTokens
      # V2-era start (~2026-03, before the exchanges' 84,902,353). The CTF is shared V1↔V2,
      # but we don't index V1 history: pUSD (V2) positions are all split after this block, and
      # any pre-V2 condition that trades on V2 is stubbed on-the-fly in handlePositionSplit.
      # This keeps the subgraph V2-focused and fast; the once-per-market derivation gate
      # bounds the CTF contract-call cost.
      startBlock: 84000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Condition
        - MarketData
        - MarketProfit
        - MarketName
        - Collateral
        - Account
        - Global
        - ConditionCollateralMap
      abis:
        - name: ConditionalTokens
          file: ./abis/ConditionalTokens.json
      eventHandlers:
        - event: ConditionPreparation(indexed bytes32,indexed address,indexed bytes32,uint256)
          handler: handleConditionPreparation
        - event: ConditionResolution(indexed bytes32,indexed address,indexed bytes32,uint256,uint256[])
          handler: handleConditionResolution
        - event: PositionSplit(indexed address,address,indexed bytes32,indexed bytes32,uint256[],uint256)
          handler: handlePositionSplit
        - event: PositionsMerge(indexed address,address,indexed bytes32,indexed bytes32,uint256[],uint256)
          handler: handlePositionsMerge
        - event: PayoutRedemption(indexed address,address,indexed bytes32,indexed bytes32,uint256[],uint256)
          handler: handlePayoutRedemption
      file: ./src/mapping.ts

  - kind: ethereum
    name: CtfExchangeV2
    network: matic
    source:
      address: "0xE111180000d2663C0091e4f400237545B87B996B"
      abi: CtfExchangeV2
      startBlock: 84902353
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trade
        - Orderbook
        - Global
        - Account
        - Condition
        - MarketPosition
        - MarketData
        - Builder
      abis:
        - name: CtfExchangeV2
          file: ./abis/CtfExchangeV2.json
      eventHandlers:
        # OrdersMatched is not indexed: the taker-summary OrderFilled (taker = exchange)
        # carries the same amounts plus fee/builder, 1:1 per match (verified on-chain).
        - event: OrderFilled(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
          handler: handleOrderFilled
      file: ./src/mapping.ts

  - kind: ethereum
    name: NegRiskCtfExchangeV2
    network: matic
    source:
      address: "0xe2222d279d744050d28e00520010520000310F59"
      abi: NegRiskCtfExchangeV2
      startBlock: 84902353
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trade
        - Orderbook
        - Global
        - Account
        - Condition
        - MarketPosition
        - MarketData
        - Builder
      abis:
        - name: NegRiskCtfExchangeV2
          file: ./abis/NegRiskCtfExchangeV2.json
      eventHandlers:
        # OrdersMatched is not indexed: the taker-summary OrderFilled (taker = exchange)
        # carries the same amounts plus fee/builder, 1:1 per match (verified on-chain).
        - event: OrderFilled(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
          handler: handleOrderFilledNegRisk
      file: ./src/mapping.ts

  # ── On-chain market names ──
  # UMA CTF Adapter (normal markets; deployed 74,797,879 — indexed from the V2-era start).
  # The negRisk UMA adapter 0x69c47De9… is intentionally NOT indexed (duplicate names under
  # a different id). Crypto Up/Down 5/15-min markets are prepared directly on CTF with no text.
  - kind: ethereum
    name: UmaCtfAdapter
    network: matic
    source:
      address: "0x65070BE91477460D8A7AeEb94ef92fe056C2f2A7"
      abi: UmaCtfAdapter
      startBlock: 84000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketName
        - Condition
      abis:
        - name: UmaCtfAdapter
          file: ./abis/UmaCtfAdapter.json
      eventHandlers:
        - event: QuestionInitialized(indexed bytes32,indexed uint256,indexed address,bytes,address,uint256,uint256)
          handler: handleQuestionInitialized
      file: ./src/mapping.ts

  - kind: ethereum
    name: NegRiskAdapter
    network: matic
    source:
      address: "0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296"
      abi: NegRiskAdapter
      startBlock: 84000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MarketName
        - NegRiskEvent
        - Condition
      abis:
        - name: NegRiskAdapter
          file: ./abis/NegRiskAdapter.json
      eventHandlers:
        - event: MarketPrepared(indexed bytes32,indexed address,uint256,bytes)
          handler: handleMarketPrepared
        - event: QuestionPrepared(indexed bytes32,indexed bytes32,uint256,bytes)
          handler: handleQuestionPrepared
      file: ./src/mapping.ts
