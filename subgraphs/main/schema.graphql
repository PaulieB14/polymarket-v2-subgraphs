# Polymarket V2 Main — lean CLOB V2 subgraph: aggregates, wallet positions/PnL, one Trade
# row per match, and on-chain market names. FPMM entities are dropped (V2 is CLOB-only).
#
# Volume convention: every V2 match emits one OrderFilled per maker order plus one "taker
# summary" OrderFilled (taker = the exchange contract) and one OrdersMatched. Platform,
# per-market and per-token volume/trade counts are taken from the taker summary ONLY, so
# each match is counted exactly once (taker-side collateral notional). Per-account stats
# are attributed from the `maker` field of every OrderFilled (each order's owner, with that
# order's own token/side/amounts); the exchange contracts are never accounts.

# ── Platform-wide aggregates ───────────────────────────────────────────────

type Global @entity(immutable: false) {
  "ID is empty string, this is a singleton"
  id: ID!

  numConditions: Int!
  numOpenConditions: Int!
  numClosedConditions: Int!

  "Unique wallets that have had an order filled (exchange contracts excluded)"
  numTraders: BigInt!

  "Matches (one per OrdersMatched / taker order fill)"
  tradesQuantity: BigInt!
  buysQuantity: BigInt!
  sellsQuantity: BigInt!
  "Taker-side collateral notional, counted once per match"
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  "Fees from every OrderFilled (maker + taker fees; none are double counted)"
  collateralFees: BigInt!
  scaledCollateralFees: BigDecimal!
  collateralBuyVolume: BigInt!
  scaledCollateralBuyVolume: BigDecimal!
  collateralSellVolume: BigInt!
  scaledCollateralSellVolume: BigDecimal!

  "Individual order fills (maker fills + taker fills)"
  orderFillsQuantity: BigInt!

  splitCount: BigInt!
  splitVolume: BigInt!
  mergeCount: BigInt!
  mergeVolume: BigInt!
  redemptionCount: BigInt!
  redemptionPayout: BigInt!

  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
}

# ── Users ──────────────────────────────────────────────────────────────────

type Account @entity(immutable: false) {
  "User address"
  id: ID!
  creationTimestamp: BigInt!
  lastSeenTimestamp: BigInt!
  lastTradedTimestamp: BigInt!
  "Order fills where this wallet's order was filled (as maker or as taker order)"
  numTrades: BigInt!
  "Collateral this wallet paid/received on its own fills"
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  feesPaid: BigInt!

  splitCount: BigInt!
  mergeCount: BigInt!
  redemptionCount: BigInt!

  marketPositions: [MarketPosition!]! @derivedFrom(field: "user")
  trades: [Trade!]! @derivedFrom(field: "taker")

  "Realized payouts from redemptions (kept for V1 compatibility)"
  profit: BigInt!
  scaledProfit: BigDecimal!
  marketProfits: [MarketProfit!]! @derivedFrom(field: "user")
}

# ── Tokens / collateral ────────────────────────────────────────────────────

type Collateral @entity(immutable: false) {
  id: ID!
  name: String!
  symbol: String!
  decimals: Int!
}

# ── Conditional Tokens ─────────────────────────────────────────────────────

type Condition @entity(immutable: false) {
  id: ID!
  "Resolver (UMA CTF Adapter / Neg Risk Adapter). Null on stub conditions prepared before startBlock."
  oracle: Bytes
  questionId: Bytes
  outcomeSlotCount: Int!
  "On-chain market title (from MarketName). Null for markets without on-chain text (e.g. Crypto Up or Down 5/15-min) or prepared before startBlock."
  title: String
  name: MarketName

  resolutionTimestamp: BigInt
  payouts: [BigDecimal!]
  payoutNumerators: [BigInt!]
  payoutDenominator: BigInt
  resolutionHash: Bytes

  preparedAtBlock: BigInt!
  preparedAtTimestamp: BigInt!

  "Matches on any outcome token of this condition (taker side, once per match)"
  tradesQuantity: BigInt!
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  fees: BigInt!

  splitCount: BigInt!
  splitVolume: BigInt!
  mergeCount: BigInt!
  mergeVolume: BigInt!
  redemptionCount: BigInt!
  redemptionPayout: BigInt!

  markets: [MarketData!]! @derivedFrom(field: "condition")
}

# ── Names (on-chain, title only) ───────────────────────────────────────────

type MarketName @entity(immutable: true) {
  "questionId (bytes32 hex) — equals Condition.questionId"
  id: ID!
  "Title, capped at 200 chars"
  title: String!
  "UMA question creator (null for negRisk)"
  creator: Bytes
  "Polymarket Gamma market id parsed from the text, if present"
  gammaId: BigInt
  "uma | negrisk"
  kind: String!
  "NegRisk event (marketId) this question belongs to"
  negRiskEvent: NegRiskEvent
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

type NegRiskEvent @entity(immutable: true) {
  "negRisk marketId (bytes32 hex)"
  id: ID!
  title: String!
  "Gamma event id parsed from the text, if present"
  gammaId: BigInt
  questions: [MarketName!]! @derivedFrom(field: "negRiskEvent")
  createdAtBlock: BigInt!
}

# ── Market metadata — ERC-1155 tokenId → Condition ─────────────────────────

type MarketData @entity(immutable: false) {
  "ERC-1155 positionId (tokenId)"
  id: ID!
  condition: Condition
  outcomeIndex: BigInt
  "Latest fill price for this outcome token"
  priceOrderbook: BigDecimal
}

"Internal: (conditionId-collateral-parentCollectionId) tuples already mapped. Not for queries."
type ConditionCollateralMap @entity(immutable: true) {
  id: ID!
}

# ── Per-user per-market tracking ───────────────────────────────────────────

type MarketPosition @entity(immutable: false) {
  "user-tokenId"
  id: ID!
  market: MarketData!
  user: Account!
  quantityBought: BigInt!
  quantitySold: BigInt!
  netQuantity: BigInt!
  valueBought: BigInt!
  valueSold: BigInt!
  netValue: BigInt!
  feesPaid: BigInt!
}

type MarketProfit @entity(immutable: false) {
  "conditionId-userAddress"
  id: ID!
  user: Account!
  condition: Condition!
  profit: BigInt!
  scaledProfit: BigDecimal!
}

# ── Trades: one lean row per match (taker order) ───────────────────────────

enum TradeType {
  Buy
  Sell
}

type Trade @entity(immutable: true) {
  "txHash-logIndex of the taker OrderFilled"
  id: ID!
  transactionHash: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  orderHash: Bytes!
  "Owner of the taker order"
  taker: Account!
  market: MarketData!
  condition: Condition
  side: TradeType!
  "Collateral (6 dp)"
  collateralAmount: BigInt!
  "Outcome tokens (6 dp)"
  tokenAmount: BigInt!
  price: BigDecimal!
  fee: BigInt!
  builder: Bytes
  "neg risk exchange?"
  negRisk: Boolean!
}

# Per-tokenId aggregates (taker side, once per match)
type Orderbook @entity(immutable: false) {
  "Token Id"
  id: ID!
  tradesQuantity: BigInt!
  buysQuantity: BigInt!
  sellsQuantity: BigInt!
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  collateralBuyVolume: BigInt!
  scaledCollateralBuyVolume: BigDecimal!
  collateralSellVolume: BigInt!
  scaledCollateralSellVolume: BigDecimal!
  lastActiveDay: BigInt!
  lastPrice: BigDecimal!
}

# Builder attribution (per order fill carrying a builder code)
type Builder @entity(immutable: false) {
  id: ID!
  orderCount: BigInt!
  volume: BigInt!
  scaledVolume: BigDecimal!
  fees: BigInt!
  scaledFees: BigDecimal!
  firstSeenTimestamp: BigInt!
  lastSeenTimestamp: BigInt!
}
